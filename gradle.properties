org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=true
android.newDsl=true

# AGP would otherwise write the git revision into META-INF/version-control-info.textproto, so an
# APK built from a later commit could never match the published one in F-Droid's reproducibility
# check. Nothing reads that file.
android.vcsInfo.include=false

kotlin.code.style=official
